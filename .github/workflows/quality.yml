name: Quality checks
on:
  pull_request:
  push:
    branches:
      - main
      - feature/topic-assessment-flow
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check Pages Functions syntax
        run: |
          node --check 'functions/api/admin/[[path]].js'
          node --check 'functions/api/learning/[[path]].js'
      - name: Run assessment unit tests
        run: npm test
      - name: Build frontend with Vite
        run: npm run build
